services:
  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD:?} --appendonly yes --dir /data --dbfilename dump.rdb
    volumes:
      - multica-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - coolify

  backend:
    image: ghcr.io/multica-ai/multica-backend:v0.4.39
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      API_DOMAIN: ${API_DOMAIN:?}
      API_PORT: "8080"
      APP_DOMAIN: ${APP_DOMAIN:?}
      APP_ENV: ${APP_ENV:-production}
      ATTACHMENT_DOWNLOAD_MODE: ${ATTACHMENT_DOWNLOAD_MODE:-proxy}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      DATABASE_URL: ${DATABASE_URL:?}
      FRONTEND_HOST: ${FRONTEND_HOST:?}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      JWT_SECRET: ${JWT_SECRET:?}
      LOCAL_UPLOAD_BASE_URL: ${LOCAL_UPLOAD_BASE_URL:-/app/data/uploads}
      MULTICA_APP_URL: ${MULTICA_APP_URL:?}
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL:?}
      PORT: "8080"
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_HOST: ${POSTGRES_HOST:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?}
      REDIS_CONNECTION_STRING: ${REDIS_URL:?}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_PORT: "6379"
      REDIS_URI: ${REDIS_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_REGION: ${S3_REGION:?}
    expose:
      - "8080"
    volumes:
      - multica-uploads:/app/data/uploads
    networks:
      - coolify

  web:
    image: ghcr.io/multica-ai/multica-web:v0.4.39
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      APP_DOMAIN: ${APP_DOMAIN:?}
      BACKEND_HOST: ${BACKEND_HOST:?}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?}
      NODE_ENV: production
      PORT: "3000"
      REMOTE_API_URL: ${REMOTE_API_URL:?}
      WEB_PORT: "3000"
    expose:
      - "3000"
    networks:
      - coolify

volumes:
  multica-redis-data:
  multica-uploads:

networks:
  coolify:
    external: true
